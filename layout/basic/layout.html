  <style>
    body {
      min-width: 360px;
      max-width: none;
      margin: 0;
      background: #F5F1EB;
      color: #171310;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    a:hover { text-decoration: none; }

    #header {
      position: relative;
      z-index: 50;
      background: rgba(245, 241, 235, 0.96);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    #header .inner {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 36px;
      min-height: 86px;
    }

    #header .topArea {
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
    }

    #header .topArea__logo,
    #header .topArea__logo a {
      display: flex;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    #header .topArea__logo img {
      display: block;
      width: auto;
      max-width: 138px;
      max-height: 54px;
      height: auto;
      object-fit: contain;
      transform: none !important;
      position: static !important;
      margin: 0 !important;
    }

    #header .navigation {
      flex: 1 1 auto;
      display: flex;
      justify-content: flex-end;
      margin: 0;
      padding: 0;
    }

    #header .btnNav,
    #header .topArea__user,
    #header .navigation__util {
      display: none !important;
    }

    #header .navigation__category ul {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 36px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #header .navigation__category li a {
      display: block;
      color: #171310;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      white-space: nowrap;
    }

    #header .navigation__category li a:hover {
      color: #8B6B4C;
    }

    #container {
      width: 100%;
      margin: 0;
    }

    #contents {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    @media (max-width: 768px) {
      #header .inner {
        width: min(100% - 28px, 1180px);
        min-height: auto;
        padding: 18px 0;
        display: block;
      }

      #header .topArea__logo,
      #header .topArea__logo a {
        justify-content: center;
      }

      #header .topArea__logo img {
        max-width: 112px;
        max-height: 44px;
      }

      #header .navigation {
        justify-content: center;
        margin-top: 14px;
      }

      #header .navigation__category ul {
        justify-content: center;
        gap: 12px 18px;
        flex-wrap: wrap;
      }

      #header .navigation__category li a {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

            <!--@import(/layout/basic/state_login.html)-->

        <!--@import(/layout/basic/navigation.html)-->

    <!--@import(/layout/basic/sidebar.html)-->

    <hr class="layout">
    <!--@import(/layout/basic/quick.html)-->
    <!--@import(/layout/basic/footer.html)-->
  </div>
  <script>
    (function () {
      var elements = document.querySelectorAll("[data-reveal]");

      if (!("IntersectionObserver" in window)) {
        elements.forEach(function (element) {
          element.classList.add("is-visible");
        });
        return;
      }

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.16, rootMargin: "0px 0px -40px 0px" });

      elements.forEach(function (element) {
        observer.observe(element);
      });
    }());
  </script>
</body>
