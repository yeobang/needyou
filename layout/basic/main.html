  <style>
      /* ✅ 헤더 배경 */
      #header {
        background: #fff !important;
      }

      /* ✅ 상단 구조 (로고 좌측 정렬) */
      #header .topArea {
        display: flex !important;
        flex-direction: row;
        justify-content: space-between;
        align-items: center !important;
        padding: 16px 0 !important;
        margin: 0 !important;
      }

      #header .topArea__logo {
        display: block;
        flex-shrink: 0;
      }

      /* ✅ 로고 크기 및 위치 (PC 기준) */
      #header .topArea__logo img {
          transform: translateY(-57px);
          width: 320px !important;
          height: 127px !important;
          display: block !important;
          object-fit: contain;
          vertical-align: middle !important;
          position: relative;
          z-index: 10;
        }

      /* 로그인/장바구니 등 우측 메뉴 */
      .topArea__user {
        display: flex;
        gap: 16px;
        font-size: 14px;
        justify-content: flex-end;
      }

      .topArea__user a {
        color: #0f172a;
        text-decoration: none;
      }

      .topArea__user a:hover {
        color: #2563eb;
      }

      /* 네비게이션 메뉴 */
      #category ul {
        display: flex;
        justify-content: center;
        gap: 32px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      #category li a {
        font-weight: 600;
        font-size: 15px;
        color: #0f172a;
        text-decoration: none;
        transition: color 0.2s;
      }

      #category li a:hover {
        color: #2563eb;
      }

      /* ✅ 모바일 반응형 */
      @media (max-width: 768px) {
          #header .topArea {
            flex-direction: column;
            align-items: center !important;
            gap: 6px;
            padding-top: 0 !important;
            position: relative;
          }

          #header .topArea__logo img {
            width: 200px !important;           /* ✅ 로고 크기 확대 */
            height: auto !important;
            transform: none !important;
            margin: 0 auto !important;
            position: relative;
            top: -25px;                         /* ✅ 위로 확실히 올리기 */
          }

          .topArea__user {
            justify-content: center;
            flex-wrap: wrap;
            margin-top: -10px; /* 로고와 간격 줄이기 */
          }

          #category ul {
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
          }
      }
  </style>
</head>

          <h1 module="Layout_LogoTop" class="topArea__logo">
            <a href="/index.html"><img src="{$logo}" alt="{$mall_name}" /></a>
          </h1>

          <!-- ✅ 로그인 등 우측 메뉴 -->
          <div class="topArea__user">
            <!--@import(/layout/basic/state_login.html)-->
          </div>
        </div>

        <!-- ✅ 네비게이션 메뉴 -->
        <!--@import(/layout/basic/navigation.html)-->
      </div>
    </header>
    <hr class="layout" />

    <!-- 사이드바 -->
    <!--@import(/layout/basic/sidebar.html)-->

      <main id="contents" role="main">
        <!--@contents-->
